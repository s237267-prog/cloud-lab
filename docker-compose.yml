version: '3.8'

services:
  backend:
    build: ./mern-demo/server
    ports:
      - "5000:5000"
    env_file:
      - ./mern-demo/server/.env
    environment:
      - PORT=5000
    restart: always

  frontend:
    build: ./mern-demo/client
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
